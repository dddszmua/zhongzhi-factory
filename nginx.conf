server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 默认反代到线上平台（与开发环境一致）
    # 若要改成本地 backend/agent，请自行把下面两处改为 host.docker.internal:8010 / :5000
    location /api/agent/ {
        proxy_pass https://fdueblab.cn/api/agent/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host fdueblab.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass https://fdueblab.cn/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host fdueblab.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }
}
